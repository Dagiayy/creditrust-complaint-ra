name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src scripts tests app.py

      - name: Format check (black)
        run: black --check src scripts tests app.py

      - name: Run unit tests
        env:
          CREDITRUST_LLM_PROVIDER: mock
        run: pytest --cov=creditrust --cov-report=term-missing -m "not integration"
