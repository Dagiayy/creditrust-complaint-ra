[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "creditrust-complaint-rag"
version = "2.0.0"
description = "Retrieval-Augmented Generation system over CFPB consumer financial complaint narratives."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dagmawi Ayenew", email = "ayenewdagmawi@gmail.com" }
]
requires-python = ">=3.10"
urls = { Repository = "https://github.com/Dagiayy/creditrust-complaint-ra.git" }


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises real model weights / network downloads (skipped by default in CI).",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]
