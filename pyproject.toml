[project]
name = "creditrust-complaint-rag"
version = "2.0.0"
description = "Retrieval-Augmented Generation system over CFPB consumer financial complaint narratives."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises real model weights / network downloads (skipped by default in CI).",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]
